[meta]
  title = "Deepgram STT Explorer"
  description = "Interactive app for exploring every Deepgram speech-to-text parameter over mic, file, batch, and TTS round-trip modes"
  author = "Jacob-Lasky"
  useCase = "Live STT"
  language = "Python"
  framework = "FastAPI"

[build]
  # uv + pyproject.toml is the single source of dependency truth.
  # DO NOT change this back to pip and requirements.txt: those files described
  # the dead v1 Flask/gevent stack and were removed.
  command = "uv sync --frozen"

[config]
  sample = "sample.env"
  output = ".env"

[post-build]
  message = "Run `uv run uvicorn app:app --port 8080` to get up and running."
