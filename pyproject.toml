[project]
name = "deepgram-stt-explorer"
version = "0.1.0"
description = "Interactive explorer for Deepgram speech-to-text parameters"
authors = [{ name = "Jacob-Lasky", email = "jacob.s.lasky@gmail.com" }]
requires-python = ">=3.12, <3.13"
readme = "README.md"
dependencies = [
    "deepgram-sdk==6.0.1",
    "fastapi>=0.115.0,<1",
    "python-socketio>=5.11.0,<6",
    "uvicorn>=0.30.0,<1",
    "httpx>=0.27.0,<1",
    "python-multipart>=0.0.9,<1",
    "python-dotenv==1.0.0",
    "pydub>=0.25.1,<0.26",
    "sounddevice>=0.5.2,<0.6",
    "mutagen>=1.47.0",
]

[tool.uv]
package = false

# uv deprecated [tool.uv] dev-dependencies in favour of PEP 735 dependency-groups.
[dependency-groups]
dev = [
    "aiohttp>=3.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.0",
    # scripts/ only, for stt/client.py's sync STTClient. DO NOT promote to
    # [project] dependencies: the async app must never ship the sync
    # websocket-client path again (see test_websocket_client_not_a_runtime_dep).
    "websocket-client>=1.9.0",
    # scripts/probe_ui.py only. A UI change needs a real-browser artifact; a
    # passing suite says nothing about the rendered DOM. The pip package is all
    # CI installs — the browser binary is a separate opt-in
    # (`uv run playwright install chromium`), so this does not slow the test job.
    "playwright>=1.61.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
